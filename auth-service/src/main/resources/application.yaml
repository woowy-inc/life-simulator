app:
  jwt:
    expiration: 86400000
    issuer: auth-service
    key-id: key-id
server:
  port: 9393
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lifesim_auth_dev
    username: dev
    password: dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9393
  application:
    name: auth-service
