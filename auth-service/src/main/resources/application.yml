app:
  jwt:
    expiration: ${JWT_EXPIRATION:1800000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
    issuer: ${JWT_ISSUER:auth-service}
    key-id: ${JWT_KEY_ID:key-id}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_DEFAULT_ZONE:http://localhost:8761/eureka/}
server:
  port: ${SERVER_PORT:9393}
spring:
  cloud:
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN:token}
      kv:
        backend: ${VAULT_KV_BACKEND:life-simulator}
        application-name: ${VAULT_KV_NAME:auth}
        default-context:
  config:
    import: ${VAULT_CONFIG_IMPORT:vault:///life-simulator/auth}
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/lifesim_auth_dev}
    username: ${DATASOURCE_USERNAME:dev}
    password: ${DATASOURCE_PASSWORD:dev}
    driver-class-name: ${DATASOURCE_DRIVER_NAME:org.postgresql.Driver}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:life-sim-group}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: ${KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
      value-deserializer: ${KAFKA_CONSUMER_VALUE_DESERIALIZER:ru.woowy.application.serializer.EventDeserializer}
    producer:
      key-serializer: ${KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      value-serializer: ${KAFKA_PRODUCER_VALUE_SERIALIZER:ru.woowy.application.serializer.EventSerializer}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:true}
  security:
    oauth2:
      authorizationserver:
        issuer: ${OAUTH2_SERVER_ISSUER:http://localhost:9393}
  application:
    name: auth-service
logging:
  level:
    org.springframework.web: debug