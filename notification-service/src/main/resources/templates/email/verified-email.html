<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email подтверждён — Woowy</title>
</head>
<body style="margin:0;padding:0;background-color:#0F172A;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td align="center" style="padding:40px 20px;">

            <div th:replace="~{email/header :: header('Email подтверждён')}"></div>

            <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
                <tr>
                    <td style="background-color:#1E293B;padding:40px;">
                        <h2 style="margin:0 0 16px;font-size:24px;font-weight:700;color:#F1F5F9;">
                            Поздравляем, <span th:text="${firstName}" style="color:#818CF8;">Пользователь</span>!
                        </h2>
                        <p style="margin:0 0 32px;font-size:15px;color:#94A3B8;line-height:1.7;">
                            Ваш email успешно подтверждён. Теперь у вас есть полный доступ к аккаунту Woowy.
                            Добро пожаловать — войдите и начните пользоваться сервисом.
                        </p>

                        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:32px;">
                            <tr>
                                <td style="background-color:#0F172A;border:1px solid #334155;border-radius:12px;padding:24px;">
                                    <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                        <tr>
                                            <td style="padding-bottom:16px;">
                                                <p style="margin:0 0 4px;font-size:12px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:0.5px;">
                                                    Имя пользователя</p>
                                                <p style="margin:0;font-size:17px;font-weight:700;color:#F1F5F9;"
                                                   th:text="${username}">username</p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td style="border-top:1px solid #334155;padding-top:16px;">
                                                <p style="margin:0 0 4px;font-size:12px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:0.5px;">
                                                    Email</p>
                                                <p style="margin:0;font-size:17px;font-weight:700;color:#F1F5F9;"
                                                   th:text="${email}">email@example.com</p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>

                        <table cellpadding="0" cellspacing="0" border="0" width="100%">
                            <tr>
                                <td align="center">
                                    <a th:href="${loginUrl}" href="#"
                                       style="display:inline-block;padding:16px 48px;background:linear-gradient(135deg,#667EEA 0%,#764BA2 100%);color:#ffffff;font-size:16px;font-weight:700;text-decoration:none;border-radius:12px;">
                                        Войти в аккаунт
                                    </a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>

            <div th:replace="~{email/footer :: footer('Если вы не регистрировались на Woowy — просто проигнорируйте это письмо. Ваши данные в безопасности.')}"></div>

        </td>
    </tr>
</table>
</body>
</html>
