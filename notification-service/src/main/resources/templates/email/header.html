<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="header(tagline)">
    <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
        <tr>
            <td align="center"
                style="background:linear-gradient(135deg,#667EEA 0%,#764BA2 100%);padding:40px 40px 32px;border-radius:20px 20px 0 0;">
                <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:20px;">
                    <tr>
                        <td style="padding:0 6px;">
                            <div style="width:12px;height:12px;background:#ffffff;border-radius:50%;display:inline-block;"></div>
                        </td>
                        <td style="padding:0 6px;">
                            <div style="width:12px;height:12px;background:rgba(255,255,255,0.7);border-radius:50%;display:inline-block;"></div>
                        </td>
                        <td style="padding:0 6px;">
                            <div style="width:12px;height:12px;background:rgba(255,255,255,0.4);border-radius:50%;display:inline-block;"></div>
                        </td>
                    </tr>
                </table>
                <h1 style="margin:0;font-size:48px;font-weight:800;color:#ffffff;letter-spacing:-1px;">Woowy</h1>
                <p style="margin:12px 0 0;font-size:16px;color:rgba(255,255,255,0.85);font-weight:500;"
                   th:text="${tagline}">Заголовок</p>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
