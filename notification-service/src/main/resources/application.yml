app:
  mail:
    from: ${EMAIL_FROM:noreply@yourdomain.com}
    from-name: ${EMAIL_FROM_NAME:From name}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
server:
  port: ${SERVER_PORT:9592}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_DEFAULT_ZONE:http://localhost:8761/eureka/}
spring:
  profiles:
    active: ${SPRING_PROFILE:dev}
  mail:
    host: ${EMAIL_HOST:host}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:username}
    password: ${EMAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: ${EMAIL_SMTP_AUTH:true}
          starttls:
            enable: ${EMAIL_STARTTLS_ENABLE:true}
            required: ${EMAIL_STARTTLS_REQUIRED:true}
  application:
    name: notification-service
  kafka:
    listener:
      ack-mode: ${KAFKA_ACK_MODE:manual}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-consumer}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: ${KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
      value-deserializer: ${KAFKA_CONSUMER_VALUE_DESERIALIZER:ru.woowy.application.serializer.EventDeserializer}
    producer:
      key-serializer: ${KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      value-serializer: ${KAFKA_PRODUCER_VALUE_SERIALIZER:ru.woowy.application.serializer.EventSerializer}