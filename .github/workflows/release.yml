name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}

      - name: Release auth-service
        id: auth
        run: |
          NEXT=$(npx -y monotag@latest tag --path=auth-service --separator=/v --conv-commit=true 2>/dev/null | head -1)
          CURRENT=$(npx -y monotag@latest latest --path=auth-service --separator=/v)
          if [ "$NEXT" != "$CURRENT" ] && [ -n "$NEXT" ]; then
            VERSION=$(echo "$NEXT" | grep -oP '\d+\.\d+\.\d+')
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" auth-service/build.gradle.kts
            git add auth-service/build.gradle.kts
            git commit -m "chore(release): $NEXT [skip ci]"
            git push
            npx -y monotag@latest tag-push \
              --path=auth-service \
              --separator=/v \
              --conv-commit=true \
              --git-username="github-actions[bot]" \
              --git-email="github-actions[bot]@users.noreply.github.com"
            npx -y monotag@latest tag \
              --path=auth-service \
              --separator=/v \
              --conv-commit=true \
              --notes-file=/tmp/auth-notes.md
            echo "tag=$NEXT" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: GitHub Release auth-service
        if: steps.auth.outputs.tag != ''
        run: |
          gh release create "${{ steps.auth.outputs.tag }}" \
            --title "${{ steps.auth.outputs.tag }}" \
            --notes-file /tmp/auth-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Sync after auth-service
        run: git fetch origin main && git reset --hard origin/main

      - name: Release gateway-service
        id: gateway
        run: |
          NEXT=$(npx -y monotag@latest tag --path=gateway-service --separator=/v --conv-commit=true 2>/dev/null | head -1)
          CURRENT=$(npx -y monotag@latest latest --path=gateway-service --separator=/v)
          if [ "$NEXT" != "$CURRENT" ] && [ -n "$NEXT" ]; then
            VERSION=$(echo "$NEXT" | grep -oP '\d+\.\d+\.\d+')
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" gateway-service/build.gradle.kts
            git add gateway-service/build.gradle.kts
            git commit -m "chore(release): $NEXT [skip ci]"
            git push
            npx -y monotag@latest tag-push \
              --path=gateway-service \
              --separator=/v \
              --conv-commit=true \
              --git-username="github-actions[bot]" \
              --git-email="github-actions[bot]@users.noreply.github.com"
            npx -y monotag@latest tag \
              --path=gateway-service \
              --separator=/v \
              --conv-commit=true \
              --notes-file=/tmp/gateway-notes.md
            echo "tag=$NEXT" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: GitHub Release gateway-service
        if: steps.gateway.outputs.tag != ''
        run: |
          gh release create "${{ steps.gateway.outputs.tag }}" \
            --title "${{ steps.gateway.outputs.tag }}" \
            --notes-file /tmp/gateway-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Sync after gateway-service
        run: git fetch origin main && git reset --hard origin/main

      - name: Release eureka-service
        id: eureka
        run: |
          NEXT=$(npx -y monotag@latest tag --path=eureka-service --separator=/v --conv-commit=true 2>/dev/null | head -1)
          CURRENT=$(npx -y monotag@latest latest --path=eureka-service --separator=/v)
          if [ "$NEXT" != "$CURRENT" ] && [ -n "$NEXT" ]; then
            VERSION=$(echo "$NEXT" | grep -oP '\d+\.\d+\.\d+')
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" eureka-service/build.gradle.kts
            git add eureka-service/build.gradle.kts
            git commit -m "chore(release): $NEXT [skip ci]"
            git push
            npx -y monotag@latest tag-push \
              --path=eureka-service \
              --separator=/v \
              --conv-commit=true \
              --git-username="github-actions[bot]" \
              --git-email="github-actions[bot]@users.noreply.github.com"
            npx -y monotag@latest tag \
              --path=eureka-service \
              --separator=/v \
              --conv-commit=true \
              --notes-file=/tmp/eureka-notes.md
            echo "tag=$NEXT" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: GitHub Release eureka-service
        if: steps.eureka.outputs.tag != ''
        run: |
          gh release create "${{ steps.eureka.outputs.tag }}" \
            --title "${{ steps.eureka.outputs.tag }}" \
            --notes-file /tmp/eureka-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Sync after eureka-service
        run: git fetch origin main && git reset --hard origin/main

      - name: Release notification-service
        id: notification
        run: |
          NEXT=$(npx -y monotag@latest tag --path=notification-service --separator=/v --conv-commit=true 2>/dev/null | head -1)
          CURRENT=$(npx -y monotag@latest latest --path=notification-service --separator=/v)
          if [ "$NEXT" != "$CURRENT" ] && [ -n "$NEXT" ]; then
            VERSION=$(echo "$NEXT" | grep -oP '\d+\.\d+\.\d+')
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" notification-service/build.gradle.kts
            git add notification-service/build.gradle.kts
            git commit -m "chore(release): $NEXT [skip ci]"
            git push
            npx -y monotag@latest tag-push \
              --path=notification-service \
              --separator=/v \
              --conv-commit=true \
              --git-username="github-actions[bot]" \
              --git-email="github-actions[bot]@users.noreply.github.com"
            npx -y monotag@latest tag \
              --path=notification-service \
              --separator=/v \
              --conv-commit=true \
              --notes-file=/tmp/notification-notes.md
            echo "tag=$NEXT" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: GitHub Release notification-service
        if: steps.notification.outputs.tag != ''
        run: |
          gh release create "${{ steps.notification.outputs.tag }}" \
            --title "${{ steps.notification.outputs.tag }}" \
            --notes-file /tmp/notification-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}