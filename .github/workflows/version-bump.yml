name: Version Bump

on:
  push:
    tags:
      - '**/v*'

jobs:
  bump:
    name: Bump build.gradle.kts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version in build.gradle.kts
        run: |
          TAG="${{ github.ref_name }}"
          SERVICE=$(echo "$TAG" | cut -d'/' -f1)
          VERSION=$(echo "$TAG" | grep -oP '\d+\.\d+\.\d+')

          if [ -f "$SERVICE/build.gradle.kts" ] && [ -n "$VERSION" ]; then
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" $SERVICE/build.gradle.kts
            git add $SERVICE/build.gradle.kts
            git diff --cached --quiet || git commit -m "chore(release): $TAG [skip ci]"
            git push
          fi