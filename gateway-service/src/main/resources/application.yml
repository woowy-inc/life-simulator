app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /api-docs/auth-service
      - name: world-service
        url: /api-docs/world-service
  api-docs:
    enabled: true
server:
  port: ${SERVER_PORT:9696}
spring:
  application:
    name: gateway-service
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_DEFAULT_ZONE:http://localhost:8761/eureka/}
logging:
  level:
    org.springframework.web: debug