server:
  port: ${SERVER_PORT:9696}
spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-route
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: time-route
              uri: lb://time-service
              predicates:
                - Path=/time/**

  application:
    name: gateway-service
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_DEFAULT_ZONE:http://localhost:8761/eureka/}